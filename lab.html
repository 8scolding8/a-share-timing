<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>回测实验室 · A股择时</title>
<link rel="stylesheet" href="lab.css">
<script src="lab_guard.js"></script>
<script src="lab_static.js"></script>
<script src="lab_engine.js" defer></script>
<script src="echarts.min.js" defer></script>
<script src="lab.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">回测实验室 <span class="muted small" id="asof"></span></div>
  <nav class="tabs" role="tablist">
    <a class="tab back" href="./" title="回到看板">← 看板</a>
    <button type="button" class="tab on" data-tab="cond" role="tab">条件回测</button>
    <button type="button" class="tab" data-tab="regime" role="tab">状态体系</button>
    <button type="button" class="tab" data-tab="compare" role="tab">方案对比</button>
    <button type="button" class="tab" data-tab="help" role="tab">口径说明</button>
  </nav>
</header>
<div id="banner" class="banner" role="status"></div>

<main>
  <!-- 条件回测 -->
  <section id="view-cond" class="view on">
    <div class="cols">
      <div class="left card" id="cond-editor"></div>
      <div class="right" id="cond-result"><div class="card empty">在左边选指标、设标准，然后点“运行回测”。也可以先从“模板”里载入一组框架原文的条件。</div></div>
    </div>
  </section>

  <!-- 状态体系 -->
  <section id="view-regime" class="view">
    <div class="cols">
      <div class="left card" id="regime-editor"></div>
      <div class="right" id="regime-result"><div class="card empty">先在左边载入“框架原文”或“v1 修改建议”，在上面改，然后点“运行回测”。</div></div>
    </div>
  </section>

  <!-- 方案对比 -->
  <section id="view-compare" class="view">
    <div class="card" id="compare-editor"></div>
    <div id="compare-result"></div>
  </section>

  <!-- 口径说明 -->
  <section id="view-help" class="view">
    <div class="card prose" id="help"></div>
  </section>
</main>

<!-- 选指标 -->
<div id="picker" class="picker" hidden>
  <div class="picker-box card">
    <div class="row">
      <strong>选择指标</strong>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="picker-close">关闭</button>
    </div>
    <div class="row">
      <input id="picker-q" class="grow" type="search" placeholder="搜索名称或代码，例如：站上、估值、VIX、沪深300">
      <select id="picker-group"></select>
    </div>
    <div id="picker-list" class="picker-list"></div>
  </div>
</div>
<footer class="foot small muted">仅供内部研究讨论，不构成投资建议。历史统计不代表未来表现。</footer>
</body>
</html>
